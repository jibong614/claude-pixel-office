<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 휴대폰 보기: 기기 폭에 맞추고 확대·축소는 막지 않는다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b2e">
  <!-- 휴대폰에 앱으로 설치(주소창 없이 열림): 안드로이드 크롬은 manifest, 아이폰은 apple-* -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Claude Office">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Claude Office</title>
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <canvas id="office"></canvas>

  <div id="hud">
    <div id="summary"></div>
    <button id="btnHook" hidden>🔕</button>
    <button id="btnAway" title="퇴근한 직원 보이기/숨기기">🚪</button>
    <button id="btnPin" title="항상 위에 표시">📌</button>
    <button id="btnSettings" title="설정">⚙️</button>
  </div>

  <div id="tooltip" hidden></div>

  <div id="empty" hidden>
    <!-- 문구는 비어 있는 이유에 따라 office.js(refreshEmpty)가 바꾼다 -->
    <div class="big" id="emptyBig">🏢 아직 출근한 직원이 없어요</div>
    <div id="emptyMsg">Claude Code에서 대화를 시작하면 책상에 직원이 나타납니다.</div>
    <div class="dim" id="emptyDim">최근 12시간 안에 쓰인 대화 기록을 봅니다.</div>
  </div>

  <aside id="panel" class="drawer" hidden>
    <button id="pClose" class="close" title="닫기">✕</button>
    <h2 id="pName"></h2>
    <div id="pTitle" class="dim"></div>
    <div id="pState" class="state"></div>
    <!-- 별명·메모: 세션 ID 기준으로 이 PC에 저장(세션 이름을 바꿔도 남음) -->
    <h3>별명 · 메모</h3>
    <input id="pNick" class="field" type="text" maxlength="30" autocomplete="off" spellcheck="false">
    <textarea id="pMemo" class="field" rows="3" placeholder="이 세션에 대한 메모 (쓰는 대로 저장됩니다)"></textarea>
    <dl>
      <dt>팀(작업 폴더)</dt><dd id="pCwd" class="mono"></dd>
      <dt>실행 위치</dt><dd id="pEntry"></dd>
      <dt>모델</dt><dd id="pModel"></dd>
      <dt>브랜치</dt><dd id="pBranch"></dd>
      <dt>마지막 활동</dt><dd id="pLast"></dd>
    </dl>
    <h3>마지막 지시</h3>
    <p id="pPrompt" class="prompt"></p>
    <section id="pInternsWrap">
      <h3>인턴(서브에이전트)</h3>
      <ul id="pInterns"></ul>
    </section>
    <h3>최근 작업</h3>
    <ul id="pLog"></ul>
    <div id="pId" class="dim mono"></div>
  </aside>

  <!-- 서랍 손잡이: 펼쳐져 있으면 서랍 왼쪽 가장자리(› 접기), 접혀 있으면 창 오른쪽 끝(‹ 이름 · 펼치기) -->
  <button id="drawerTab" hidden><span class="arrow">›</span><span class="lbl"></span></button>

  <!-- 설정: 항목은 office.js 의 SETTINGS 목록으로 그린다 -->
  <aside id="settings" class="drawer" hidden>
    <button id="sClose" class="close" title="닫기">✕</button>
    <h2>⚙️ 설정</h2>
    <div id="sBody"></div>
  </aside>

  <!-- QR 코드(휴대폰 보기 설정용) — qrcode-generator 1.4.4, MIT, Kazuhiko Arase -->
  <script src="vendor/qrcode.js"></script>
  <script src="office.js"></script>
</body>
</html>
