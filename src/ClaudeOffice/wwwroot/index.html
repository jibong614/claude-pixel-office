<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 휴대폰 보기: 기기 폭에 맞추고 확대·축소는 막지 않는다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b2e">
  <!-- 휴대폰에 앱으로 설치(주소창 없이 열림): 안드로이드 크롬은 manifest, 아이폰은 apple-* -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Claude Office">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Claude Office</title>
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <canvas id="office"></canvas>
  <!-- 작게 보기(위젯): 그림 대신 직원·상태 목록. 앱 창도 작아진다 -->
  <div id="wlist" hidden></div>

  <div id="hud">
    <div id="summary"></div>
    <!-- 영어 화면이면 office.js 가 data-en(글)·data-en-title·data-en-ph 로 바꾼다 -->
    <button id="btnWidget" title="작게 보기(목록) — 직원·상태만 한 줄씩" data-en-title="Compact view (list) — one line per employee">▤</button>
    <button id="btnToday" title="오늘의 근무 일지 — 일한 시간·지시·토큰" data-en-title="Today's work log — work time, prompts, tokens">📊</button>
    <button id="btnHook" hidden>🔕</button>
    <button id="btnAway" title="퇴근한 직원 보이기/숨기기">🚪</button>
    <button id="btnPin" title="항상 위에 표시">📌</button>
    <button id="btnSettings" title="설정" data-en-title="Settings">⚙️</button>
  </div>

  <div id="tooltip" hidden></div>

  <div id="empty" hidden>
    <!-- 문구는 비어 있는 이유에 따라 office.js(refreshEmpty)가 바꾼다 -->
    <div class="big" id="emptyBig" data-en="🏢 Nobody has come to work yet">🏢 아직 출근한 직원이 없어요</div>
    <div id="emptyMsg" data-en="Start a conversation in Claude Code and an employee appears at a desk.">Claude Code에서 대화를 시작하면 책상에 직원이 나타납니다.</div>
    <div class="dim" id="emptyDim" data-en="Shows conversations from the last 12 hours.">최근 12시간 안에 쓰인 대화 기록을 봅니다.</div>
  </div>

  <aside id="panel" class="drawer" hidden>
    <button id="pClose" class="close" title="닫기" data-en-title="Close">✕</button>
    <!-- 📊 오늘의 근무 일지(모든 직원) — 열려 있으면 아래 직원 상세 대신 -->
    <div id="pReport" hidden></div>
    <div id="pMain">
    <h2 id="pName"></h2>
    <div id="pTitle" class="dim"></div>
    <div id="pState" class="state"></div>
    <!-- 별명·메모: 세션 ID 기준으로 이 PC에 저장(세션 이름을 바꿔도 남음) -->
    <h3 data-en="Nickname · Memo">별명 · 메모</h3>
    <input id="pNick" class="field" type="text" maxlength="30" autocomplete="off" spellcheck="false">
    <textarea id="pMemo" class="field" rows="3" placeholder="이 세션에 대한 메모 (쓰는 대로 저장됩니다)" data-en-ph="Memo about this session (saved as you type)"></textarea>
    <div id="pSync" class="dim"></div>
    <dl>
      <dt data-en="Team">팀</dt><dd><span id="pTeam"></span> <span class="seat"><button id="pSeatL" class="mini" title="같은 팀 안에서 자리를 앞으로" data-en-title="Move the seat earlier in the team" data-en="◀ Seat">◀ 자리</button><button id="pSeatR" class="mini" title="같은 팀 안에서 자리를 뒤로" data-en-title="Move the seat later in the team" data-en="Seat ▶">자리 ▶</button></span></dd>
      <dt data-en="Folder">작업 폴더</dt><dd><span id="pCwd" class="mono"></span> <button id="pOpenDir" class="mini" title="탐색기로 작업 폴더 열기" data-en-title="Open the working folder in Explorer" data-en="📂 Open">📂 열기</button></dd>
      <dt data-en="Runs in">실행 위치</dt><dd id="pEntry"></dd>
      <dt data-en="Model">모델</dt><dd id="pModel"></dd>
      <dt data-en="Branch">브랜치</dt><dd id="pBranch"></dd>
      <dt data-en="Last active">마지막 활동</dt><dd id="pLast"></dd>
    </dl>
    <h3 data-en="Today">오늘</h3>
    <div id="pToday" class="today"></div>
    <h3 data-en="Last prompt">마지막 지시</h3>
    <p id="pPrompt" class="prompt"></p>
    <section id="pInternsWrap">
      <h3 data-en="Interns (subagents)">인턴(서브에이전트)</h3>
      <ul id="pInterns"></ul>
    </section>
    <h3 data-en="Recent work">최근 작업</h3>
    <ul id="pLog"></ul>
    <div id="pId" class="dim mono"></div>
    </div>
  </aside>

  <!-- 서랍 손잡이: 펼쳐져 있으면 서랍 왼쪽 가장자리(› 접기), 접혀 있으면 창 오른쪽 끝(‹ 이름 · 펼치기) -->
  <button id="drawerTab" hidden><span class="arrow">›</span><span class="lbl"></span></button>

  <!-- 설정: 항목은 office.js 의 SETTINGS 목록으로 그린다 -->
  <aside id="settings" class="drawer" hidden>
    <button id="sClose" class="close" title="닫기" data-en-title="Close">✕</button>
    <h2 data-en="⚙️ Settings">⚙️ 설정</h2>
    <div id="sBody"></div>
  </aside>

  <!-- QR 코드(휴대폰 보기 설정용) — qrcode-generator 1.4.4, MIT, Kazuhiko Arase -->
  <script src="vendor/qrcode.js"></script>
  <script src="office.js"></script>
</body>
</html>
